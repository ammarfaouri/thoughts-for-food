name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: t4f
          POSTGRES_PASSWORD: t4f
          POSTGRES_DB: t4f
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t4f -d t4f"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: t4f

    env:
      DATABASE_URL: postgresql://t4f:t4f@localhost:5432/t4f?schema=public
      JWT_ACCESS_SECRET: ci-access-token-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL_DAYS: 30
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: t4f/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run fast tests
        run: npm test

      - name: Run database tests
        run: npm run test:db

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev
